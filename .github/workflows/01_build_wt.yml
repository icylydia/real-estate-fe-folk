name: Build WT
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
    - name: Install Dependencies
      run: yarn install
    - name: Build WT Version
      run: yarn build-wt
    - name: Archive WT Version
      uses: actions/upload-artifact@v4
      with:
        name: wt-dist
        path: dist
