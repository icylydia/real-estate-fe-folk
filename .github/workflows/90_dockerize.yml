name: Dockerize
on:
  workflow_dispatch:
    inputs:
      env:
        required: true
        description: 'Environment'
        type: choice
        options:
          - at
          - wt
          - chuwa
permissions:
  actions: read
  contents: read
  deployments: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: yarn install

      - name: Build ${{ github.event.inputs.env }}
        run: yarn build-${{ github.event.inputs.env }}

      - name: Archive ${{ github.event.inputs.env }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.env }}-dist
          path: dist
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  dockerize:
    runs-on: ubuntu-latest
    needs: package
    environment: ${{ github.event.inputs.env }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download ${{ github.event.inputs.env }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.inputs.env }}-dist
          path: dist

      - name: Build Docker image and push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: "linux/amd64,linux/arm64"
          tags: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME }}:latest
          context: .
          secrets: |
            "version=${{ github.sha }}"
