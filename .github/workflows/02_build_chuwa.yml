name: Build Chuwa Version on Ubuntu
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install Dependencies
        run: yarn install
      - name: Build Chuwa Version
        run: yarn build-chuwa
      - name: Archive Chuwa Version
        uses: actions/upload-artifact@v4
        with:
          name: chuwa-dist
          path: dist
